<style>
/* Stile comune dei minigiochi di El Falcon e Il Crocco: stesso aspetto di Operazione Viaggettino
   (notte viola, limone, corallo, Pixelify Sans + VT323, pannelli con bordo chiaro e ombra piena). */
:root {
  --night: #1b1530; --night-2: #120e24; --panel: #2a2145; --panel-2: #352a58; --line: #4a3d78;
  --ink: #fff6e0; --ink-dim: #c9bfe0; --lemon: #ffd84a; --lemon-dk: #d9b21f; --coral: #ff6b57; --sea: #7cc6e8; --leaf: #7fd18a; --rose: #f2a3b0;
  --paper: #fff6e0; --paper-ink: #2a1a2e; --red: #c0392b;
  --f-display: "Pixelify Sans", "Courier New", monospace; --f-num: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif; --f-body: "VT323", "Courier New", monospace; --f-hand: "Caveat", "Comic Sans MS", cursive;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; touch-action: manipulation; overscroll-behavior: none; }
body { background: var(--night-2); color: var(--ink); overflow: hidden; overscroll-behavior: none; font-family: var(--f-display); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
button, input { font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
#app { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; background: var(--night-2); }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
#cv { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
#fx { position: absolute; left: 0; top: 0; pointer-events: none; }
button { font-family: var(--f-display); color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--lemon); outline-offset: 2px; }

/* Top bar chips */
.topbar { position: absolute; top: calc(8px + var(--sat)); right: max(10px, var(--sar)); display: flex; gap: 6px; z-index: 30; }
.chip { background: rgba(18,14,36,.72); border: 2px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink); line-height: 1; }
.chip:active { background: var(--panel-2); }

/* Big buttons (title, panels) */
.btn { border: 3px solid var(--paper-ink); border-radius: 12px; padding: 13px 16px; font-size: 18px; font-weight: 700; background: var(--ink); color: var(--paper-ink); box-shadow: 0 5px 0 var(--paper-ink); line-height: 1.05; transition: transform .06s, box-shadow .06s; }
.btn.primary { background: var(--lemon); }
.btn.coral { background: var(--coral); }
.btn.leaf { background: var(--leaf); }
.btn.ghost { background: transparent; color: var(--ink-dim); border-color: var(--line); box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--paper-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 17px; opacity: .8; margin-top: 2px; }

/* Title screen */
.title { position: absolute; inset: 0; z-index: 20; overflow-y: auto; background: linear-gradient(180deg, #2a1f55 0%, #6a3a6e 48%, #e86a5a 78%, #ffb36b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: calc(24px + var(--sat)) max(16px, var(--sar)) calc(24px + var(--sab)) max(16px, var(--sal)); text-align: center; }
.title::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16%; background: repeating-linear-gradient(180deg, #2a2a6a 0 4px, #3a3a8a 4px 8px); opacity: .9; pointer-events: none; }
.t-eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--lemon); position: relative; z-index: 1; }
.t-name { margin: 0; font-size: clamp(34px, 10vw, 64px); line-height: .92; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 var(--paper-ink), 6px 6px 0 rgba(0,0,0,.25); position: relative; z-index: 1; text-wrap: balance; }
.t-sub { margin: -4px 0 0; font-family: var(--f-body); font-size: 22px; line-height: 1.05; color: var(--ink); position: relative; z-index: 1; max-width: 340px; text-wrap: balance; }
.t-art { image-rendering: pixelated; position: relative; z-index: 1; }
.t-btns { display: flex; flex-direction: column; gap: 10px; width: min(100%, 300px); position: relative; z-index: 1; }
.t-foot { position: relative; z-index: 1; font-family: var(--f-body); font-size: 18px; color: var(--ink); opacity: .85; margin: 0; }

/* Dialog box (portrait + name + typewriter text) */
#dialog { position: absolute; left: max(10px, var(--sal)); right: max(10px, var(--sar)); bottom: calc(14px + var(--sab)); z-index: 40; max-width: 680px; margin: 0 auto; min-height: 112px; background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 3px var(--night-2), 0 10px 30px rgba(0,0,0,.45); display: flex; gap: 12px; padding: 12px 14px 14px; cursor: pointer; }
#dialog[data-who="narr"] { background: #241c3d; border-color: var(--ink-dim); }
#dialog[data-who="narr"] #dlg-portrait { display: none; }
#dlg-portrait { width: 68px; height: 68px; flex: none; image-rendering: pixelated; background: var(--night); border-radius: 8px; border: 2px solid var(--line); align-self: flex-start; }

  /* ---------- the Album, the letter, the challenges: the same as Memory Lane (styles taken from there) ---------- */

  /* the guastafeste: a character who walks on, grabs the face-down cards, shuffles and deals them */
  #pest { position: absolute; inset: 0; z-index: 32; }

  .pest-card span { display: block; margin-top: 4px; font-family: var(--f-body); font-size: 20px; line-height: 1; color: var(--coral); transform: skewX(8deg); }

  /* the end of the game: all the photos fly into one Album, which closes */
  #assemble { position: absolute; inset: 0; z-index: 34; animation: abIn .6s ease both; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(64px + var(--sat)) 16px calc(16px + var(--sab)); background: rgba(10,7,22,.62); }
  .ab { --w: min(460px, 96vw); position: relative; width: var(--w); height: calc(var(--w) * .66); display: flex; perspective: 1400px; }
  .ab-l, .ab-r { position: relative; width: 50%; height: 100%; }

  .ab-r { background: repeating-linear-gradient(0deg, transparent 0 13px, rgba(166,124,82,.08) 13px 14px), linear-gradient(90deg, #e8d6ae 0, #fbefd2 9%, #fdf4dc 60%, #f3e3bd 100%); border-radius: 2px 8px 8px 2px; box-shadow: 0 0 0 3px var(--paper-ink), 2px 2px 0 1px #e9dcbc, 4px 4px 0 1px #d8c79f, 6px 6px 0 1px var(--paper-ink), 9px 11px 0 rgba(10,7,22,.4); }

  .ab-front::after { content: ""; position: absolute; right: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(90deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }
  .ab-r::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 14px; background: linear-gradient(270deg, transparent, rgba(42,26,46,.22)); pointer-events: none; }
  .ab-slots { position: absolute; inset: 9% 9%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 7%; }
  .ab-slot { background: rgba(42,26,46,.07); border: 1.5px dashed rgba(42,26,46,.22); border-radius: 2px; transform: rotate(var(--rot)); }

  .ab-slot.on::before { left: -2px; top: -2px; clip-path: polygon(0 0, 100% 0, 0 100%); }
  .ab-slot.on::after { right: -2px; top: -2px; clip-path: polygon(0 0, 100% 0, 100% 100%); }

    background: radial-gradient(120% 90% at 30% 20%, rgba(255,255,255,.12), transparent 55%), repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px), linear-gradient(90deg, #7e2230 0, #9e2f3a 9%, #b8343c 12%, #b8343c 100%);

  .ab-seal { position: absolute; right: -12px; bottom: -12px; width: 46px; height: 46px; border-radius: 50%; background: #9e2f3a; box-shadow: 0 0 0 3px var(--paper-ink); display: grid; place-items: center; font-style: normal; font-size: 22px; color: var(--paper); opacity: 0; transform: scale(2.2) rotate(-20deg); }

  .ab-btns { display: flex; width: min(360px, 92vw); justify-content: center; margin-top: 14px; }

  .book { width: 100%; max-width: 440px; margin: auto; display: flex; flex-direction: column; gap: 12px; }
  .book-page { background: repeating-linear-gradient(0deg, transparent 0 17px, rgba(166,124,82,.07) 17px 18px), linear-gradient(90deg, #ead9b2 0, #fdf4dc 6%, #fbefd2 85%, #f1e0bb 100%); color: var(--paper-ink); border-radius: 6px 14px 14px 6px; box-shadow: 0 0 0 3px var(--paper-ink), 3px 3px 0 1px #e9dcbc, 6px 6px 0 1px #d8c79f, 8px 8px 0 1px var(--paper-ink), 12px 13px 0 rgba(10,7,22,.4); padding: 14px 16px 16px 22px; position: relative; transform-origin: left center; min-height: 320px; }

  /* the paper pocket on the Album's last page, with the envelope tucked in */

  .tr-veh { position: absolute; left: 0; bottom: 14px; transform: translateX(-50%); animation: trGo 1.7s .25s cubic-bezier(.55,0,.35,1) both; }
  .tr-veh canvas { display: block; height: 40px; width: auto; image-rendering: pixelated; }
  .tr-plane .tr-veh canvas { animation: trFly 1.7s .25s ease-in-out both; }
  .tr-boat .tr-veh canvas { animation: trBob .5s ease-in-out infinite alternate; }
  .tr-train .tr-veh canvas { animation: trRattle .12s steps(2) infinite; }
  @keyframes trGo { from { left: 0; } to { left: 100%; } }
  @keyframes trFly { 0% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-26px) rotate(-8deg); } 75% { transform: translateY(-26px) rotate(6deg); } 100% { transform: translateY(0) rotate(0); } }
  @keyframes trBob { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(2px) rotate(2deg); } }
  @keyframes trRattle { from { transform: translateY(0); } to { transform: translateY(-1px); } }
  .tr-sub { margin: 0; font-family: var(--f-body); font-size: 24px; color: var(--ink-dim); opacity: 0; transition: opacity .3s; }
  .travel.arrived .tr-sub { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .tr-veh { animation-duration: .01s; } .tr-veh canvas { animation: none !important; } }
  /* the window when you lose: always the same */
  .panel.lose { max-width: 560px; gap: 12px; }
  .lose-top { display: flex; align-items: center; gap: 16px; }
  .lose-pic { flex: 0 0 auto; width: 64px; height: 64px; border-radius: 12px; background: radial-gradient(circle at 50% 70%, #3a2d6e, #1a1430); display: grid; place-items: center; box-shadow: 0 0 0 2px var(--line); }
  .lose-pic canvas { height: 44px; width: auto; image-rendering: pixelated; transform: rotate(-8deg); }
  .lose-top h2 { margin: 0; } .lose-top .sub { margin: 4px 0 0; }
  .lose-row { display: flex; gap: 8px; } .lose-row .btn.primary { flex: 1.6; } .lose-row .btn { flex: 1; }
  .intro-skip { position: absolute; right: max(10px, var(--sar, 0px)); bottom: calc(10px + var(--sab)); z-index: 40; }
  /* the circle that closes and opens between scenes (as in Memory Lane) */
  #iris { position: fixed; inset: 0; z-index: 80; pointer-events: auto; display: grid; place-items: center; }
  #iris .iris-hole { position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; border-radius: 50%; box-shadow: 0 0 0 200vmax #0b0816; }
  #iris.close .iris-hole { animation: irisClose .65s cubic-bezier(.6,0,.4,1) forwards; }
  #iris.shut .iris-hole { width: 0; height: 0; margin: 0; animation: none; }
  #iris.open .iris-hole { animation: irisOpen .65s cubic-bezier(.6,0,.4,1) forwards; }
  @keyframes irisClose { from { width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; } to { width: 0; height: 0; margin: 0; } }
  @keyframes irisOpen { from { width: 0; height: 0; margin: 0; } to { width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; } }
  #iris .iris-t { position: relative; z-index: 1; opacity: 0; text-align: center; font-family: var(--f-hand); font-weight: 700; font-size: 44px; line-height: 1; color: var(--paper, #fff6e0); transition: opacity .25s; margin: 0; }
  #iris .iris-t small { display: block; margin-bottom: 6px; font-family: var(--f-body); font-weight: 400; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--lemon); }
  #iris.shut .iris-t { opacity: 1; animation: irisT .45s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes irisT { from { transform: translateY(10px) scale(.94); } }
  #iris .iris-logo { display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: var(--f-display); }
  #iris .iris-logo small { display: block; font-family: var(--f-body); font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--lemon); margin: 0; }
  #iris .iris-logo b { font-size: clamp(40px, 10vw, 64px); line-height: .92; font-weight: 700; color: var(--ink); text-shadow: 3px 3px 0 var(--paper-ink), 6px 6px 0 rgba(0,0,0,.25); }
  .intro-skip { z-index: 90 !important; }
  @media (prefers-reduced-motion: reduce) { .result-stars .rs.new { animation: none; } }
  /* Gioca ancora (the panels of Memory Lane's «Gioca ancora») */
  .free-pick { max-width: 380px; }
  .free-done { text-align: center; }
  .free-moves { font-size: 22px; margin: 6px 0 12px; color: var(--ink); }
  .free-moves b { font-family: var(--f-num); color: var(--lemon); font-size: 34px; }
  .rev-rec { margin: 0; text-align: center; font-family: var(--f-hand); font-weight: 700; font-size: 30px; color: var(--lemon); animation: stampIn2 .45s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes stampIn2 { from { opacity: 0; transform: scale(1.8) rotate(-8deg); } to { transform: rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { .rev-rec { animation: none; } }
  .end-done .rev-rec { margin: 0 0 6px; }
  .end-best, .end-coins { margin: 0 0 8px; text-align: center; color: var(--ink-dim); font-family: var(--f-num); font-weight: 700; font-size: 15px; }
  .end-best b, .end-coins b { color: var(--ink); }
  .free-pick .row.next-row, .end-done .row.next-row { margin-top: 6px; }
  @media (orientation: landscape) and (max-height: 500px) { .end-done .row.next-row { grid-template-columns: 2fr 1fr 1fr; } .end-done .row.next-row .btn.wide { grid-column: auto; } .free-pick .row.next-row { grid-template-columns: 2fr 1fr; } .free-pick .row.next-row .btn.wide { grid-column: auto; } }
  /* TEMPORARY: cheats (to be removed) */
  .chip.cheat { border-style: dashed; border-color: var(--lemon); color: var(--lemon); }
  .cheats { max-width: 520px; }
  .cheat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .cheat-grid .btn { padding: 10px 10px; font-size: 15px; box-shadow: 0 3px 0 var(--paper-ink); }
  .cheat-grid .btn:disabled { opacity: .4; }
  @media (orientation: landscape) and (max-height: 500px) { .cheat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .cheats { max-width: 760px; } }
  /* The mini-boss's presentation tag: in the middle of the screen on a dark band, it drops in on a string,
     then flies up to the hearts in the HUD (the run goes on underneath) */
  .boss-card { position: absolute; left: 0; right: 0; top: 24%; z-index: 22; pointer-events: none; display: flex; justify-content: center; padding: 26px 0 22px; background: linear-gradient(180deg, transparent, rgba(18,14,36,.62) 22%, rgba(18,14,36,.62) 78%, transparent); animation: bcband .3s ease-out both; }
  .bc-tag { position: relative; display: flex; align-items: center; gap: 14px; background: var(--paper); color: var(--paper-ink); border-radius: 14px; padding: 12px 34px 12px 14px; box-shadow: 0 0 0 3px var(--paper-ink), 7px 7px 0 var(--coral); transform-origin: 50% -40px; animation: bcdrop .75s cubic-bezier(.25,1.5,.45,1) both, bcswing 1.6s .7s ease-in-out both; }
  .bc-tag::before { content: ""; position: absolute; left: 50%; top: -60px; width: 2px; height: 60px; margin-left: -1px; background: var(--ink-dim); }
  .bc-tag::after { content: ""; position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--night); box-shadow: 0 0 0 2px var(--paper-ink); }
  .bc-por canvas { display: block; width: 72px; height: 72px; background: var(--night); border-radius: 10px; border: 3px solid var(--paper-ink); }
  .bc-txt { display: flex; flex-direction: column; gap: 8px; }
  .bc-txt b { font-size: 32px; line-height: 1; white-space: nowrap; }
  .bc-pips { display: flex; gap: 8px; } .bc-pips canvas { width: 36px; height: 32px; }
  .bc-hint { font-family: var(--f-body); font-size: 24px; line-height: 1; color: #4a3a5a; }
  .bc-stamp { position: absolute; right: -18px; bottom: -16px; font-size: 30px; font-weight: 700; color: var(--coral); background: var(--paper); border: 3px solid var(--coral); border-radius: 12px; padding: 3px 10px; transform: rotate(-12deg); animation: bcstamp .3s .55s cubic-bezier(.3,1.6,.5,1) both; }
  .sal-row { display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px; border-radius: 10px; background: rgba(18,14,36,.55); box-shadow: inset 0 0 0 2px var(--line); }
  .sal-row canvas { width: 30px; height: 13px; image-rendering: pixelated; }
  .sal-row canvas.pop { animation: salpop .9s .3s cubic-bezier(.3,1.7,.5,1) both; }
  @keyframes salpop { 0% { transform: scale(.4); filter: brightness(2.2); } 60% { transform: scale(1.35); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
  .ah-r { display: flex; align-items: center; gap: 10px; }
  .boss-card.ko .bc-tag { animation-duration: .6s; }
  .boss-card.ko .bc-pips canvas { opacity: .55; }
  .boss-card.ko .bc-stamp { right: -46px; bottom: -24px; font-size: 34px; letter-spacing: .04em; color: #fff6e0; background: var(--coral); border-color: var(--paper-ink); box-shadow: 3px 3px 0 var(--paper-ink); transform: rotate(-10deg); animation: bcstamp .35s .85s cubic-bezier(.3,1.8,.5,1) both; }
  .boss-card.out { animation: bcbandout .45s ease-in both; } .boss-card.out .bc-tag { animation: bcout .45s ease-in both; }
  @keyframes bcband { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bcbandout { to { background: transparent; } }
  @keyframes bcdrop { from { transform: translateY(-260%); } to { transform: translateY(0); } }
  @keyframes bcswing { 0% { transform: rotate(0); } 25% { transform: rotate(2deg); } 60% { transform: rotate(-1.2deg); } 100% { transform: rotate(0); } }
  @keyframes bcstamp { from { opacity: 0; transform: rotate(-12deg) scale(2.4); } to { opacity: 1; transform: rotate(-12deg) scale(1); } }
  @keyframes bcout { to { transform: translateY(-120px) scale(.2); opacity: 0; } }
  @media (orientation: landscape) and (max-height: 500px) { .boss-card { top: 20%; } }
  @media (prefers-reduced-motion: reduce) { .boss-card, .bc-tag, .bc-stamp, .boss-card.out .bc-tag { animation: none; } .boss-card.out { opacity: 0; } }
  /* Stage card: a paper train ticket (postcard on the left, perforation, the rest on the right) */
  .tk-card { position: relative; width: min(100%, 720px); margin: auto; background: var(--paper); color: var(--paper-ink); border-radius: 14px; box-shadow: 0 0 0 3px var(--paper-ink), 8px 8px 0 var(--lemon); display: grid; grid-template-columns: minmax(0, 36%) minmax(0, 1fr); animation: pcin .45s cubic-bezier(.2,1.3,.4,1) both; }
  .tk-back { position: absolute; left: -12px; top: -12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--paper-ink); background: var(--ink); color: var(--paper-ink); font-size: 26px; font-weight: 700; line-height: 1; padding: 0 0 3px; box-shadow: 0 3px 0 var(--paper-ink); }
  .tk-back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--paper-ink); }
  .tk-photo { position: relative; padding: 16px 18px 16px 18px; border-right: 3px dashed #c9b89c; display: flex; align-items: center; justify-content: center; }
  .tk-photo::before, .tk-photo::after { content: ""; position: absolute; right: -12px; width: 20px; height: 20px; border-radius: 50%; background: rgba(10,7,22,.92); box-shadow: inset 0 0 0 3px var(--paper-ink); }
  .tk-photo::before { top: -11px; } .tk-photo::after { bottom: -11px; }
  .tk-slot { position: relative; width: 100%; transform: rotate(-1.5deg); }
  .tk-pc { display: block; width: 100%; aspect-ratio: 3 / 2; height: auto; background: #fff; padding: 5px 5px 12px; box-shadow: 0 2px 0 #c9b89c, 0 0 0 1px #e3d8c4; }
  .tk-slot.empty { background: #2a2145; border-radius: 6px; box-shadow: 0 0 0 2px #4a3d78; }
  .tk-slot.empty .tk-pc { background: transparent; box-shadow: none; opacity: .14; filter: grayscale(1) brightness(.3); }
  .tk-q { position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; font-weight: 700; letter-spacing: .1em; color: var(--ink-dim); }
  .tk-stamp { position: absolute; right: 8px; bottom: 6px; transform: rotate(-10deg); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #2a55a0; border: 3px solid #2a55a0; border-radius: 8px; padding: 4px 8px; background: rgba(255,246,224,.9); animation: stampin .5s .25s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes stampin { from { opacity: 0; transform: rotate(-10deg) scale(2.2); } to { opacity: 1; transform: rotate(-10deg) scale(1); } }
  .tk-main { padding: 14px 18px 14px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .tk-main h2 { margin: 0; font-size: 34px; line-height: .95; letter-spacing: .02em; }
  .tk-sub { margin: -2px 0 0; font-family: var(--f-hand); font-weight: 700; font-size: 23px; line-height: 1; color: #6a5a7a; }
  .tk-goals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-top: 6px; padding-right: 6px; }
  .tk-goal { position: relative; display: flex; gap: 4px; align-items: center; border: 2px dashed #c9b89c; border-radius: 10px; padding: 6px 5px; min-width: 0; }
  .tk-goal.on { border-style: solid; border-color: var(--paper-ink); background: #fff3c2; }
  .tk-ic { flex: none; display: flex; align-items: center; justify-content: center; width: 24px; height: 26px; }
  .tk-ic canvas { width: auto; height: 24px; }
  .tk-ic.g-tk canvas { height: 18px; } .tk-ic.g-hit canvas { height: 20px; }
  .tk-goal b { position: absolute; right: -8px; top: -11px; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; color: #c9b89c; background: var(--paper); border: 2px dashed #c9b89c; }
  .tk-goal.on b { color: var(--paper-ink); background: var(--lemon); border: 2px solid var(--paper-ink); } 
  .tk-goal small { font-family: var(--f-body); font-size: 18px; line-height: .95; color: #4a3a5a; white-space: nowrap; }
  .tk-how { display: flex; gap: 16px; align-items: center; }
  .how { display: flex; align-items: center; gap: 8px; }
  .how i { position: relative; width: 44px; height: 44px; border-radius: 10px; background: var(--night); display: flex; justify-content: center; overflow: hidden; }
  .how i canvas { width: 28px; height: 30px; margin-top: 10px; image-rendering: pixelated; position: relative; z-index: 1; }
  .how-swipe i canvas { margin-left: 8px; }
  /* swipe: a dashed track with an arrow, next to the hand going down */
  .how-swipe i::before { content: ""; position: absolute; left: 9px; top: 6px; width: 3px; height: 26px; background: repeating-linear-gradient(to bottom, var(--lemon) 0 4px, transparent 4px 7px); }
  .how-swipe i::after { content: ""; position: absolute; left: 5px; top: 31px; border: 5.5px solid transparent; border-top: 7px solid var(--lemon); }
  .how-tap i canvas { animation: htap 1.1s steps(1) infinite; }
  .how-tap i::after { content: ""; position: absolute; left: 50%; top: 6px; width: 8px; height: 8px; margin-left: -5px; z-index: 2; border-radius: 50%; border: 2px solid var(--lemon); opacity: 0; animation: hring 1.1s ease-out infinite; }
  @keyframes htap { 0%, 55% { transform: translateY(0); } 60%, 80% { transform: translateY(3px); } }
  @keyframes hring { 0%, 58% { opacity: 0; transform: scale(.4); } 62% { opacity: 1; } 100% { opacity: 0; transform: scale(2.4); } }
  .how-swipe i canvas { animation: hswipe 1.2s cubic-bezier(.5,0,.6,1) infinite; }
  @keyframes hswipe { 0% { transform: translateY(-10px); opacity: 0; } 15% { opacity: 1; } 75% { transform: translateY(8px); opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
  .how small, .tk-how.keys small { font-family: var(--f-body); font-size: 21px; line-height: 1; color: #4a3a5a; }
  .tk-how kbd { font-family: var(--f-num); font-size: 13px; font-weight: 700; border: 2px solid var(--paper-ink); border-radius: 5px; padding: 0 5px; background: #fff; }
  .tk-go { margin-top: auto; padding: 12px 16px !important; font-size: 22px !important; letter-spacing: .04em; }
  @media (orientation: landscape) and (max-height: 500px) {
    .tk-card { width: min(100%, 700px); }
    .tk-main { padding: 10px 16px 12px 18px; gap: 6px; }
    .tk-main h2 { font-size: 30px; } .tk-sub { font-size: 21px; }
    .tk-photo { padding: 12px 14px; }
  }
  @media (orientation: portrait) { .tk-card { grid-template-columns: 1fr; } .tk-photo { border-right: 0; border-bottom: 3px dashed #c9b89c; } .tk-photo::before, .tk-photo::after { display: none; } }
  @media (prefers-reduced-motion: reduce) { .tk-card, .tk-stamp, .how i canvas, .how-tap i::after { animation: none; } }
</style>

// Generic humanoid (12x16) for NPCs, enemies and bosses
function humanoid(o) {
  const hair = o.hair || 'short';
  let head;
  if (hair === 'bald') head = ['....ssss....', '..ssssssss..', '..ssssssss..'];
  else if (hair === 'bun') head = ['....AAAA....', '..AAAAAAAA..', '..AssssssA..'];
  else if (hair === 'long') head = ['...HHHHHH...', '..HHHHHHHH..', '.HHssssssHH.'];
  else if (hair === 'cap') head = ['...CCCCCC...', '..CCCCCCCC..', '.CCCCCCCCCC.'];
  else if (hair === 'tophat') head = ['...KKKKKK...', '...KKKKKK...', '.KKKKKKKKKK.'];
  else head = ['...HHHHHH...', '..HHHHHHHH..', '..HssssssH..'];
  let core = 'ssessess';
  if (o.glasses) core = 'kekkkkek';
  if (o.shades) core = 'kkkkkkkk';
  if (o.monocle) core = 'ssesYeYs';
  const side = hair === 'long' ? 'H' : 's';
  let mouth = '..sssppsss..';
  let chin = '...ssssss...';
  if (o.beard) { mouth = '..sHHppHHs..'; chin = '...HHHHHH...'; }
  const face = ['.' + side + core + side + '.', '.' + side + 'ssssssss' + side + '.', mouth, chin];
  const acc = o.acc || 'T';
  const body = [
    '..TTTTTTTT..',
    '.TTTTxxTTTT.',
    '.sTTTxxTTTs.',
    '.sTTTxxTTTs.',
    '..TTTTTTTT..'
  ].map(r => r.replace(/x/g, acc === 'none' ? 'T' : 'x'));
  const legs = ['..LLLLLLLL..', '..LLL..LLL..', '..LLL..LLL..', '..nnn..nnn..'];
  const rows = [...head, ...face, ...body, ...legs];
  const map = { H: o.hairC || '#2b2020', A: o.hairC || '#c8c8d0', C: o.capC || '#f4f4f4', T: o.top || '#8a8f9c', x: o.accC || '#c0392b', L: o.legs || '#3a3f55', s: o.skin || '#f1c7a1', K: '#1a1420' };
  return { rows, map };
}

const SPRITE_CACHE = {};
function rowsToCanvas(rows, map, scale = 1) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const cv = document.createElement('canvas'); cv.width = w * scale; cv.height = h * scale;
  const cx = cv.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.') continue;
    cx.fillStyle = (map && map[ch]) || PAL[ch] || '#ff00ff';
    cx.fillRect(x * scale, y * scale, scale, scale);
  }
  return cv;
}
function flipCanvas(cv) {
  const f = document.createElement('canvas'); f.width = cv.width; f.height = cv.height;
  const c = f.getContext('2d'); c.translate(cv.width, 0); c.scale(-1, 1); c.drawImage(cv, 0, 0); return f;
}
function outlineCanvas(cv, color = '#1a1024') {
  const o = document.createElement('canvas'); o.width = cv.width + 2; o.height = cv.height + 2;
  const c = o.getContext('2d');
  const tint = document.createElement('canvas'); tint.width = cv.width; tint.height = cv.height;
  const t = tint.getContext('2d'); t.drawImage(cv, 0, 0); t.globalCompositeOperation = 'source-in'; t.fillStyle = color; t.fillRect(0, 0, cv.width, cv.height);
  [[0, 1], [2, 1], [1, 0], [1, 2]].forEach(([dx, dy]) => c.drawImage(tint, dx, dy));
  c.drawImage(cv, 1, 1); return o;
}

function jewelKey() { return (typeof window !== 'undefined' && window.VG_JEWELS) || ''; }

    if (jk.includes('o')) set(8, 8, 'U');

    if (jk.includes('b')) set(10, 11, 'U');

}
function charFrames(kind) {

  const Bot = (() => {

    function danger(p, t, gone) {
      const { hw, hh } = dims(p);
      if (hazardHit(p)) return { hit: true };
      const dt0 = t - G.t;
      for (const e of G.enemies) {
        if (e.dead || gone.has(e.id) || Math.abs(e.x - p.x) > 160) continue;
        if (e.ghost) continue;
        const at = e.boss ? bossAt(e, dt0) : enemyAt(e, dt0); if (!at) continue;
        const ex = at.x, ey = at.y;
        if (p.x + hw > ex - e.w / 2 && p.x - hw < ex + e.w / 2 && p.y > ey - e.h && p.y - hh < ey) {
          const stomp = p.vy > 40 && p.y - (ey - e.h) < (e.boss ? 16 : 10);
          if (stomp) return { stomp: e };
          if (e.boss) return { hit: true };
          if (!(canRam(e) || p.speedG > 0)) return { hit: true };
        }
      }
      if (G.th.quad && p.blocked) return { hit: true }; // crashing into a rock costs a heart

      for (const f of G.fallers) {
        if (f.done || Math.abs(f.x - p.x) > 40) continue;
        let fy;
        if (f.on) fy = f.y + f.vy * dt0 + 190 * dt0 * dt0;
        else if (p.x > f.x - G.th.speed * 1.75) { const tt = Math.max(0, dt0 - Math.max(0, (f.x - G.th.speed * 1.75 - P.x) / G.th.speed)); fy = -20 + 190 * tt * tt; }
        else continue;
        if (fy > p.y - hh - 4 && fy - 8 < p.y) return { hit: true };
      }
      return null;
    }

      const p = Object.assign({}, p0), h = 1 / 60, gone = new Set();
      let t = t0, el = 0, bonus = 0, i = 0;
      const lastAt = pl.length ? Math.max(...pl.map(a => a.at)) : 0;
      const speed = G.th.speed * (P.speedG > 0 ? 1.3 : 1);
      while (el < maxT) {
        p.vx = speed; el += h; i++;
        const now = a => a.at >= el - h - 1e-9 && a.at < el - 1e-9;
        const jump = pl.some(a => !a.slide && now(a)), down = pl.some(a => a.slide && now(a));

        t += h;

        const d = danger(p, t, gone);
        if (d && d.hit) return { dead: true, x: p.x };
        if (d && d.stomp) { gone.add(d.stomp.id); bonus += d.stomp.boss ? 900 : 25; p.vy = STOMP_HOLD_V; p.jumps = 1; p.cut = false; p.ground = false; }
        if (i % 3 === 0) for (const e of picks) { if (!e.got && Math.abs(e.x - p.x) < 12 && e.y > p.y - 26 && e.y < p.y + 8) { e.got = true; bonus += e.t === 'ticket' ? 500 : e.t === 'power' ? 40 : e.t === 'special' ? 30 : 6; } }
        if (el > lastAt + 0.12 && el >= 0.14 && p.ground && !(p.slide > 0.05)) break;

    }

      [], [{ at: 0, hold: 0.04 }], [{ at: 0, hold: 0.16 }], [{ at: 0, hold: 0.5 }],
      [{ at: 0, hold: 0.5 }, { at: 0.2, hold: 0.5 }], [{ at: 0, hold: 0.5 }, { at: 0.36, hold: 0.5 }], [{ at: 0, hold: 0.5 }, { at: 0.52, hold: 0.5 }],
      [{ at: 0, hold: 0.16 }, { at: 0.3, hold: 0.5 }], [{ at: 0.1, hold: 0.5 }], [{ at: 0.2, hold: 0.5 }],
      [{ at: 0, slide: true }], [{ at: 0.12, slide: true }], [{ at: 0.25, slide: true }]

      };
      place(); addEventListener('resize', place);

      const hp = G.happy; hp.t += dt; const pop = VG.REDUCED ? 1 : hp.t < 0.12 ? 1.35 : hp.t < 0.24 ? 1.15 : 1, wob = VG.REDUCED ? 0 : Math.round(Math.sin(hp.t * 5) * 1.5);
      st.text('BUON ANNO!', st.VW / 2, st.VH * 0.3 + wob, { size: Math.max(30, 12 * st.SCALE) * pop, col: '#ffd84a', align: 'center', stroke: '#1a1024' });
    }
  }
  // one burst, on its own (the boss's KO, the stroke of midnight)
  function fwBurst(x, y) { const col = pick(['#ffd84a', '#ff6b57', '#7cc6e8', '#7fd18a', '#f2a3b0', '#b79cf0']); for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2; fw.push({ x, y, vx: Math.cos(a) * rnd(45, 75), vy: Math.sin(a) * rnd(45, 75), life: 1.2, col }); } Audio.sfx('firework'); }
  function drawFireworks(c, dt) {
    if (fireworks && Math.random() < dt * 2.2) { const x = rnd(st.VW * 0.2, st.VW * 0.9), y = rnd(st.VH * 0.1, st.VH * 0.4), col = pick(['#ffd84a', '#ff6b57', '#7cc6e8', '#7fd18a', '#f2a3b0', '#b79cf0']); for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; fw.push({ x, y, vx: Math.cos(a) * rnd(40, 70), vy: Math.sin(a) * rnd(40, 70), life: 1.1, col }); } Audio.sfx('firework'); }
    for (const f of fw) { f.life -= dt; f.vy += 40 * dt; f.x += f.vx * dt; f.y += f.vy * dt; c.globalAlpha = clamp(f.life, 0, 1); R(c, f.x, f.y, 1, 1, f.col); }
    c.globalAlpha = 1; fw = fw.filter(f => f.life > 0);
    if (G.mode === 'board' || G.mode === 'title') fireworks = 0;
  }

  paintTitle(); VG.fontsReady.then(paintTitle);
  showTitle();
  requestAnimationFrame(frame);

  // hooks for automated tests / video recordings
  window.HR = { G, P, save, LEVELS, go, levelIntro, showBoard, startLevel, setAuto: v => { G.auto = v; Bot.reset(); }, Bot, pose: falconPose };
})();

</script>
